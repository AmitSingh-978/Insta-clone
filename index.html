<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="card">
        <div class="full_screen"></div>
        <div class="story_section">

        </div>  
        <div class="image_area">
            <div class="image">
                <i class="bi bi-heart-fill"></i>
                <img src="https://images.unsplash.com/photo-1433477155337-9aea4e790195?w=620&auto=format&fit=crop&q=60&ixlib=rb-4.0.3"
                    alt="">
            </div>
        </div>
        <div class="btn_section">
            <span class="text">Stranger</span>
            <button>Add Friend</button>
        </div>

    </div>


    <script>
        const arr = [
            {
                dp: "https://plus.unsplash.com/premium_photo-1672691612717-954cdfaaa8c5?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8cHJvZmVzc2lvbmFsJTIwd29tYW58ZW58MHx8MHx8fDA%3D",
                story:
                    "https://plus.unsplash.com/premium_photo-1675198764382-94d5c093df30?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8c2VyZW5lfGVufDB8fDB8fHww",
            },
            {
                dp: "https://plus.unsplash.com/premium_photo-1670282393309-70fd7f8eb1ef?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8cG9ydHJhaXQlMjBnaXJsfGVufDB8fDB8fHww",
                story:
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhtl6kKwud3ghFquuukijsNhsWDRmv31t8Tg&s",
            },
            {
                dp: "https://images.unsplash.com/photo-1587382981310-506e3e278950?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fGdpcmxzJTIwcGhvdG98ZW58MHx8MHx8fDA%3D",
                story:
                    "https://plus.unsplash.com/premium_photo-1667423049497-291580083466?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8ZmllbGR8ZW58MHx8MHx8fDA%3D",
            },
            {
                dp: "https://plus.unsplash.com/premium_photo-1668895511243-1696733f4fcb?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Z2lybCUyMGZhY2V8ZW58MHx8MHx8fDA%3D",
                story:
                    "https://plus.unsplash.com/premium_photo-1667126444822-94fb21279436?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8cGVyZmVjdHxlbnwwfHwwfHx8MA%3D%3D",
            },
            {
                dp: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTz7tkp7RwYEvJM0dJ7K91L5ZDQ6lXOJdXDbA&s",
                story:
                    "https://plus.unsplash.com/premium_photo-1664300792059-863ccfe55932?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8Zm9yZXN0fGVufDB8fDB8fHww",
            },
            {
                dp: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwXRsEwpFFX0OKKI2dQwdnS3hsLq_2Bogf2g&s",
                story:
                    "https://plus.unsplash.com/premium_photo-1666901328566-5c06309281bd?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8ZmllbGR8ZW58MHx8MHx8fDA%3D",
            },
        ];




        let cluster = ""
        let storySection = document.querySelector('.story_section')
        let fullScreen = document.querySelector('.full_screen')
        let image = document.querySelector('.image')
        let icon = document.querySelector('.image i')
        let text = document.querySelector('.text')
        let btn = document.querySelector('.btn_section button')
        let card = document.querySelector('#card')
        let crsr = document.querySelector('.cursor')
        let check = 0




        arr.forEach((ele, index) => {
            cluster += ` <div class="story">
                <img id="${index}" src="${ele.dp}" alt="">
                </div>`
                
                storySection.innerHTML = cluster
                storySection.addEventListener('click', (getValue) => {
                    // console.log(img)
                    fullScreen.style.display = "block"
                    fullScreen.style.backgroundImage = `url(${arr[getValue.target.id].story})`

                setTimeout(() => {
                    fullScreen.style.display = "none"
                }, 2000)
            })
        })
        image.addEventListener('dblclick', () => {
            icon.style.transform = "translate(-50%,-50%) scale(1)"
            icon.style.color = "red"
            icon.style.opacity = 1

            setTimeout(() => {
                icon.style.opacity = 0
            }, 1000)
            setTimeout(() => {
                icon.style.transform = "translate(-50%,-50%) scale(0)"
            }, 2000)
        })

        btn.addEventListener('click', () => {
            if (check == 0) {
                text.innerHTML = "Friends"
                text.style.color = "green"
                btn.innerHTML = "Remove Friend"
                check = 1
            } else {
                text.innerHTML = "Stranger"
                text.style.color = "red"
                btn.innerHTML = "Add Friend"
                check = 0
            }
        })
    </script>

</body>

</html>
